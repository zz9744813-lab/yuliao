<html lang="zh-CN">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Language Genome · 研究台（成品样例）</title>
<style>
:root{
  --bg:#0b0e14; --panel:#131822; --panel2:#171d29; --line:#242c3a; --line2:#2f3a4d;

  --acc:#4da3ff; --acc2:#7c6cff; --ok:#39d98a; --warn:#ffbf47; --bad:#ff5f7a; --plan:#8a94a6;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);
  font:13.5px/1.6 "Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;}
a{color:var(--acc);text-decoration:none}
.app{display:grid;grid-template-columns:242px 1fr;min-height:100vh}

/* ---------- 侧栏 ---------- */
.side{background:#0e121a;border-right:1px solid var(--line);padding:14px 10px 30px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand b{font-size:16px;letter-spacing:.3px;display:block}
.brand b span{color:var(--acc)}
.brand small{color:var(--tx3);font-size:11.5px;line-height:1.5;display:block;margin-top:4px}
.gg{color:var(--tx3);font-size:10.5px;letter-spacing:.12em;margin:14px 8px 6px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;color:var(--tx2);font-size:13px;margin-bottom:1px}
.nav a:hover{background:#161c27;color:var(--tx)}
.nav a.on{background:#1b2432;color:#fff;box-shadow:inset 2px 0 0 var(--acc)}
.nav a i{font-style:normal;color:var(--tx3);width:15px;text-align:center;font-size:12px}
.nav a .bd{margin-left:auto;font-size:10px;padding:1px 5px;border-radius:20px;border:1px solid}
.bd.y{color:var(--ok);border-color:#1f5a41;background:#0f2419}
.bd.p{color:var(--warn);border-color:#5c4620;background:#241f10}
.bd.n{color:var(--plan);border-color:#39414f;background:#161b24}

/* ---------- 主区 ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:rgba(11,14,20,.93);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crumb{font-size:12.5px;color:var(--tx3)}
.crumb b{color:var(--tx);font-weight:600;font-size:14px}
.pill{font-size:11px;color:var(--tx2);border:1px solid var(--line2);background:#131924;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill b{color:var(--tx);font-family:var(--mono);font-weight:600}
.sp{flex:1}
.canvas{padding:18px 22px 60px;max-width:1500px}
.page{display:none}.page.on{display:block}
h2.pt{font-size:19px;margin:2px 0 4px;font-weight:650}
p.pd{color:var(--tx2);margin:0 0 16px;font-size:12.8px;max-width:1000px}
.note{background:#101724;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:10px 13px;margin:0 0 16px;font-size:12.6px;color:var(--tx2)}
.note.warn{border-left-color:var(--warn)}.note.bad{border-left-color:var(--bad)}.note.ok{border-left-color:var(--ok)}
.note b{color:var(--tx)}

/* ---------- 组件 ---------- */
.grid{display:grid;gap:13px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:1250px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.card h3{margin:0 0 10px;font-size:12.5px;color:var(--tx2);font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-size:11px;color:var(--tx3)}
.kpi{font-family:var(--mono);font-size:25px;font-weight:600;letter-spacing:-.5px}
.kpi.s{font-size:19px}
.kpi small{font-family:inherit;font-size:12px;color:var(--tx3);font-weight:400;margin-left:4px}
.kl{font-size:11.5px;color:var(--tx3);margin-top:2px}
.ks{font-size:11.5px;color:var(--tx2);margin-top:6px}
.up{color:var(--ok)}.dn{color:var(--bad)}.wn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:12.4px}
th{text-align:left;color:var(--tx3);font-weight:600;font-size:11.3px;letter-spacing:.03em;
  padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #1a212c;vertical-align:top}
tbody tr:hover{background:#161d29}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.m{font-family:var(--mono);font-size:11.8px;color:var(--tx2)}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--line2);color:var(--tx2);background:#151b26;white-space:nowrap}
.tag.ok{color:var(--ok);border-color:#1f5a41;background:#0f2419}
.tag.bad{color:var(--bad);border-color:#5c2331;background:#241016}
.tag.warn{color:var(--warn);border-color:#5c4620;background:#221d10}
.tag.acc{color:var(--acc);border-color:#1f4266;background:#101d2c}
.bar{height:7px;border-radius:6px;background:#1d2531;overflow:hidden;min-width:50px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.bar.ok>i{background:linear-gradient(90deg,#2fa96c,#39d98a)}
.bar.bad>i{background:linear-gradient(90deg,#8c2b40,#ff5f7a)}
.bar.warn>i{background:linear-gradient(90deg,#8a6520,#ffbf47)}
.mono{font-family:var(--mono)}
.tiny{font-size:11.4px;color:var(--tx3)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
button{font:inherit;font-size:12.3px;padding:6px 12px;border-radius:8px;border:1px solid var(--line2);
  background:#182030;color:var(--tx);cursor:pointer}
button:hover{border-color:var(--acc);color:#fff}
button.pri{background:linear-gradient(180deg,#2b6fd4,#2059ad);border-color:#3a7fe0;color:#fff}
button.gh{background:transparent}
button:disabled{opacity:.45;cursor:default}
.panes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
@media(max-width:1300px){.panes{grid-template-columns:1fr}}
.txt{background:#0f131c;border:1px solid var(--line);border-radius:8px;padding:11px 13px;
  font-size:13.5px;line-height:1.95;color:#dfe6f1}
.txt.k{color:#fff;background:#101a26;border-color:#22405e}
.txt .hl{background:#2a3d1e;color:#d8f0b8;border-radius:3px;padding:0 2px}
.jk{font-family:var(--mono);font-size:12px;color:#bcd3f0;background:#0f141d;border:1px solid var(--line);
  border-radius:7px;padding:9px 11px;white-space:pre-wrap;line-height:1.75;max-height:430px;overflow:auto}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:12.3px}
.kv b{color:var(--tx3);font-weight:600}
.kv span{color:var(--tx2)}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 7px;margin:2px 4px 2px 0;
  border-radius:6px;background:#141b26;border:1px solid var(--line2);color:var(--tx2)}
.dag{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}
@media(max-width:1100px){.dag{grid-template-columns:repeat(3,1fr)}}
.node{background:#141a25;border:1px solid var(--line2);border-radius:9px;padding:9px 10px;position:relative}
.node b{display:block;font-size:12.4px;margin-bottom:2px}
.node .st{font-size:10.5px;color:var(--tx3)}
.node.done{border-color:#1f5a41;background:#101d18}
.node.run{border-color:#2b6fd4;background:#101a2c;box-shadow:0 0 0 2px #12263f}
.node.wait{opacity:.72;border-style:dashed}
.foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);color:var(--tx3);font-size:11.4px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{padding:4px 10px;font-size:12px}
.seg button.on{background:#1e2939;border-color:var(--acc);color:#fff}
</style>
</head>

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fm = n => (n==null?'—':n.toLocaleString('en-US'));
const f2 = n => Number(n).toFixed(2);
const pct = n => (n*100).toFixed(1)+'%';
function kpi(label,val,sub,cls){return `<div class="card"><div class="kl">${label}</div>
  <div class="kpi ${cls||''}">${val}</div>${sub?`<div class="ks">${sub}</div>`:''}</div>`}
function tbl(head,rows){const hd=a=>Array.isArray(a)?`<th class="${a[1]||''}">${a[0]}</th>`:`<th>${a}</th>`;
  return `<table><thead><tr>${head.map(hd).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${r.map(c=>Array.isArray(c)?`<td class="${c[1]||''}">${c[0]}</td>`:`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function barc(v,max,cls,w){w=w||70;const p=Math.max(2,Math.min(100,(v/max)*100));
  return `<div style="display:flex;align-items:center;gap:8px"><div class="bar ${cls||''}" style="width:${w}px"><i style="width:${p}%"></i></div><span class="mono tiny">${v}</span></div>`}

const G = [['dash','corpus','frame','arena','resid'],['judge','pref','hard','strat','bench'],['exp','model','train','flow','obs','set']];
let cur = 'dash';
const bdCls = {'y':'y','p':'p','n':'n'};
const bdTxt = {'y':'已建成','p':'部分','n':'规划'};
function render(){
  const gs = ['nav1','nav2','nav3'];
  G.forEach((grp,gi)=>{
    document.getElementById(gs[gi]).innerHTML = grp.map(id=>{
      const p = PAGES.find(x=>x.id===id);
      return `<a href="#" data-p="${id}" class="${id===cur?'on':''}"><i>${p.ico}</i>${p.name.split(' ')[0]}
        <span class="bd ${bdCls[p.bd]}">${bdTxt[p.bd]}</span></a>`;
    }).join('');
  });
  document.querySelectorAll('[data-p]').forEach(a=>a.onclick=e=>{e.preventDefault();cur=a.dataset.p;render();window.scrollTo({top:0})});
  const p = PAGES.find(x=>x.id===cur);
  document.getElementById('tbar').innerHTML =
    `<div class="crumb">Language Genome / <b>${p.name}</b></div>
     <span class="pill">快照 <b>2026-09-18 20:35</b></span>
     <span class="pill">语料 <b>295,955</b> 段</span>
     <span class="pill">Frame <b>1,711</b></span>
     <span class="pill">候选 <b>2,689</b></span>
     <span class="pill">调用 <b>20,059</b></span>
     <span class="pill">最佳评委 κ <b class="wn">+0.112</b></span>
     <span class="pill">cc-v1 最佳 <b>91.2%</b></span>
     <span class="sp"></span>
     <span class="pill" style="border-color:#1f5a41;color:#9fe6c0">只读快照 · 未改动任何代码</span>`;
  document.getElementById('cv').innerHTML = `<h2 class="pt">${p.name}</h2><p class="pd">${p.desc}</p>
    ${p.render()}<div class="foot">示例界面（成品形态示意）· 数据字段与统计全部来自只读快照
    <span class="mono">F:\\agi\\language-genome\\data\\language_genome.db</span> 与
    <span class="mono">docs/final-report.md</span>；标「规划中 / 部分」的模块在样例里仅为骨架。</div>`;
  if(cur==='arena'){D.hot=0;document.getElementById('jout').innerHTML='';}
}
function reveal(){
  document.getElementById('ma').textContent='deepseek-v4.1-flash · T=0.5 · pv=reconstruct_v1';
  document.getElementById('mb').textContent='人类原文（将夜·猫腻）';
  document.getElementById('tb').classList.add('k');
  document.getElementById('ta').innerHTML = esc(D.aiTxt).replace('半晌', '<span class="hl">半晌</span>');
  document.getElementById('jout').innerHTML = `<div class="note warn" style="margin-top:12px">
    <b>揭盲</b>：A 是模型（补环境、补动作、补时间副词），B 是人类（全段只写一个动作与一次声响，情绪零显化）。
    评委偏好 A 的程度，正是人类偏好被击败的地方。</div>`;
}
function judge(){
  const rows = D.judges.map(j=>{
    const pick = j.pick>0.6?'A（模型）':(j.pick>0.55?'A（模型）':'B（人类）');
    return [`${j.m} <span class="tiny">${j.pv}</span>`,`${pick}`,
      `<span class="mono">conf ${f2(0.75+Math.random()*0.15)}</span>`,
      `<span class="tag ${j.k>0.1?'warn':'bad'}">κ ${j.k>0?'+':''}${f2(j.k)}</span>`];
  });
  document.getElementById('jout').innerHTML = `<div class="card" style="margin-top:12px">
   <h3>7 口径评委（历史 κ 为本段同类题的真实池化值）<span class="r">仅示意投票方向</span></h3>
   ${tbl([['评委','m'],['选哪个',''],['自信度',''],['历史 κ','']],rows)}
   <div class="tiny" style="margin-top:8px">多数口径挑了 A（模型）—— 与人类判定相反。
    这类样本直接进入硬样本库（当前 118 条）。</div></div>`;
}
render();
</script>
