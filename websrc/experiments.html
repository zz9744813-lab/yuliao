<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验引擎 · 语言基因组</title>
<script>(function(){try{var t=localStorage.getItem('lg_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="/lab/_shared/tokens.css">
<link rel="stylesheet" href="/lab/_shared/base.css">
<link rel="stylesheet" href="/lab/_shared/editorial.css">
</head>
<body>
<div class="lg-shell">
  <main class="lg-main">
    <div id="banner" class="banner"></div>

    <header class="lg-head">
      <div class="row">
        <h1>实验引擎</h1>
        <span class="meta" id="genAt">—</span>
      </div>
      <div class="sub">Experiments · 实验状态机 / 近期实验 / 报告产出</div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="card">
      <div class="card-head"><h2>状态分布</h2><span class="hint">by_status</span></div>
      <div class="card-body"><div class="bars" id="barsStatus"></div></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>近期实验（按更新时间降序）</h2>
        <span class="hint" id="rowCount">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <p class="note">
      实验创建与运行（<span class="mono">POST /experiments</span>、<span class="mono">/experiments/{id}/run</span>）
      是写操作，只在命令行/接口层做；研究台只读状态。
      带 <span class="mono">error</span> 的行表示该实验结束时留有错误信息，展开原因需查
      <span class="mono">data/logs/</span>。
    </p>
    <footer class="lg-foot"></footer>
  </main>
</div>

<script src="/lab/_shared/lg.js"></script>
<script src="/lab/_shared/editorial.js"></script>
<script>
LG.init('experiments', function (d, el) {
  var st = d.by_status || {};
  var rows = (d.recent || []).slice().sort(function (a, b) {
    return String(b.updated_at || b.created_at || '').localeCompare(String(a.updated_at || a.created_at || ''));
  });

  LG.statCards(el.stats, [
    { value: d.total,        label: '实验总数' },
    { value: st.done,        label: '已完成', tone: 'ok',  hint: 'by_status.done' },
    { value: st.created,     label: '已创建未跑', hint: 'by_status.created' },
    { value: st.running,     label: '运行中', tone: 'warn', hint: 'by_status.running' },
    { value: d.reports,      label: '报告产出' },
    { value: rows.length,    label: '本页展示' }
  ]);

  LG.bars(LG.$('barsStatus'), st);

  LG.table(el.tbody, rows, [
    { key: 'id',         label: 'ID' },
    { key: 'name',       label: '实验名' },
    { key: 'status',     label: '状态', render: function (r) { return LG.badge(r.status); } },
    { key: 'n_segments', label: '段落数', num: true },
    { key: 'created_at', label: '创建', fmt: 'time' },
    { key: 'updated_at', label: '更新', fmt: 'time' },
    { key: 'error',      label: '错误', render: function (r) {
        return r.error ? '<span class="badge bad">有</span>' : '<span style="color:var(--dim)">—</span>';
      } }
  ], { head: el.head });

  LG.$('rowCount').textContent = '共 ' + LG.fmtNum(rows.length) + ' 条（近 ' + LG.fmtNum(20) + ' 条上限）';
});
</script>
</body>
</html>
