<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验引擎 · 中文文风研究台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e1116;
    color: #c9d1d9;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px;
    line-height: 1.5;
  }
  .page { max-width: 1200px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  header h1 { font-size: 22px; font-weight: 600; color: #e6edf3; }
  header p { font-size: 13px; color: #8b949e; margin-top: 4px; }

  .banner {
    display: none;
    background: rgba(210, 153, 34, 0.12);
    border: 1px solid #9e6a03;
    color: #e3b341;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .banner.show { display: block; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: #161b22;
    border: 1px solid #263041;
    border-radius: 10px;
    padding: 16px 18px;
  }
  .stat-card .value {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 26px;
    font-weight: 600;
    color: #58a6ff;
    font-variant-numeric: tabular-nums;
  }
  .stat-card .label {
    font-size: 12px;
    color: #8b949e;
    margin-top: 6px;
  }

  .panel {
    background: #161b22;
    border: 1px solid #263041;
    border-radius: 10px;
    overflow: hidden;
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid #263041;
  }
  .panel-head h2 { font-size: 15px; font-weight: 600; color: #e6edf3; }
  .panel-head .meta { font-size: 12px; color: #8b949e; font-family: ui-monospace, Menlo, monospace; }

  .table-wrap { overflow-x: auto; max-height: 560px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    position: sticky;
    top: 0;
    background: #161b22;
    color: #8b949e;
    font-weight: 500;
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid #263041;
    white-space: nowrap;
    z-index: 1;
  }
  tbody td {
    padding: 10px 14px;
    border-bottom: 1px solid #21262d;
    white-space: nowrap;
  }
  tbody tr:hover { background: #1c2129; }
  td.num, th.num {
    text-align: right;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  .empty {
    padding: 48px 0;
    text-align: center;
    color: #8b949e;
    font-size: 13px;
  }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    border: 1px solid transparent;
  }
  .badge.running { color: #58a6ff; border-color: #1f4e79; background: rgba(56,139,253,.12); }
  .badge.done    { color: #3fb950; border-color: #196c2e; background: rgba(46,160,67,.12); }
  .badge.failed  { color: #f85149; border-color: #8e2f2a; background: rgba(248,81,73,.12); }
  .badge.pending { color: #8b949e; border-color: #30363d; background: rgba(139,148,158,.08); }

  .progress {
    width: 140px;
    height: 6px;
    background: #21262d;
    border-radius: 999px;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
  }
  .progress > i {
    display: block;
    height: 100%;
    background: #58a6ff;
    border-radius: 999px;
  }
  .progress-label {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    color: #8b949e;
    margin-left: 8px;
  }
  .fail-high { color: #f85149; }
  .fail-mid  { color: #e3b341; }
  .fail-low  { color: #3fb950; }

  .note {
    margin-top: 14px;
    font-size: 12px;
    color: #8b949e;
  }
  @media (max-width: 640px) {
    body { padding: 14px; }
    .progress { width: 90px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>实验引擎</h1>
    <p>实验列表 · 阶段进度 · Token 消耗 · 失败率监控</p>
  </header>

  <div class="banner" id="banner">数据接口不可用，以下为示例结构</div>

  <div class="stats" id="stats"></div>

  <div class="panel">
    <div class="panel-head">
      <h2>实验列表</h2>
      <span class="meta" id="generatedAt"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>实验名称</th>
            <th>阶段</th>
            <th>状态</th>
            <th>进度</th>
            <th class="num">Token 消耗</th>
            <th class="num">失败率</th>
            <th>更新时间</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">暂无数据</div>
    </div>
  </div>

  <p class="note" id="note"></p>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  function fmtNum(n) {
    if (n === null || n === undefined || isNaN(Number(n))) return '—';
    return Number(n).toLocaleString('zh-CN');
  }
  function fmtPct(n) {
    if (n === null || n === undefined || isNaN(Number(n))) return '—';
    return (Number(n) * 100).toFixed(1) + '%';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function statusBadge(s) {
    var map = {
      running: ['running', '进行中'],
      completed: ['done', '已完成'],
      done: ['done', '已完成'],
      failed: ['failed', '失败'],
      pending: ['pending', '排队中']
    };
    var m = map[String(s || '').toLowerCase()] || ['pending', s || '未知'];
    return '<span class="badge ' + m[0] + '">' + esc(m[1]) + '</span>';
  }
  function failClass(rate) {
    var r = Number(rate);
    if (isNaN(r)) return '';
    if (r >= 0.1) return 'fail-high';
    if (r >= 0.03) return 'fail-mid';
    return 'fail-low';
  }

  function renderStats(stats) {
    var box = $('stats');
    box.innerHTML = '';
    var list = Array.isArray(stats) && stats.length ? stats : [
      { label: '实验总数', value: 0 },
      { label: '进行中', value: 0 },
      { label: 'Token 总消耗', value: 0 },
      { label: '平均失败率', value: 0 }
    ];
    list.forEach(function (s) {
      var card = document.createElement('div');
      card.className = 'stat-card';
      card.innerHTML = '<div class="value">' + fmtNum(s.value) + '</div>' +
        '<div class="label">' + esc(s.label) + '</div>';
      box.appendChild(card);
    });
  }

  function renderRows(rows) {
    var tbody = $('tbody');
    tbody.innerHTML = '';
    if (!Array.isArray(rows) || !rows.length) {
      $('empty').style.display = 'block';
      return;
    }
    $('empty').style.display = 'none';
    rows.forEach(function (r) {
      var prog = (r.progress !== null && r.progress !== undefined && !isNaN(Number(r.progress)))
        ? Math.max(0, Math.min(1, Number(r.progress))) : 0;
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + esc(r.name || r.id || '—') + '</td>' +
        '<td>' + esc(r.stage || '—') + '</td>' +
        '<td>' + statusBadge(r.status) + '</td>' +
        '<td><span class="progress"><i style="width:' + (prog * 100) + '%"></i></span>' +
        '<span class="progress-label">' + Math.round(prog * 100) + '%</span></td>' +
        '<td class="num">' + fmtNum(r.tokens) + '</td>' +
        '<td class="num ' + failClass(r.fail_rate) + '">' + fmtPct(r.fail_rate) + '</td>' +
        '<td>' + esc(r.updated_at || '—') + '</td>';
      tbody.appendChild(tr);
    });
  }

  function showBanner() { $('banner').classList.add('show'); }

  // 先渲染空结构，保证接口失败时页面完整
  renderStats(null);
  renderRows([]);

  fetch('/console/experiments')
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (data) {
      renderStats(data.stats);
      renderRows(data.rows);
      if (data.generated_at) $('generatedAt').textContent = '生成时间：' + data.generated_at;
      if (data.note) $('note').textContent = data.note;
    })
    .catch(function () {
      showBanner();
    });
})();
</script>
</body>
</html>
