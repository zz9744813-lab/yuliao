<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作流 · 语言基因组</title>
<script>(function(){try{var t=localStorage.getItem('lg_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="/lab/_shared/tokens.css">
<link rel="stylesheet" href="/lab/_shared/base.css">
<link rel="stylesheet" href="/lab/_shared/editorial.css">
</head>
<body>
<div class="lg-shell">
  <main class="lg-main">
    <div id="banner" class="banner"></div>

    <header class="lg-head">
      <div class="row">
        <h1>工作流</h1>
        <span class="meta" id="genAt">—</span>
      </div>
      <div class="sub">Workflow · 工作流定义 / 引擎阶段 / 作业队列进度</div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="card">
      <div class="card-head"><h2>引擎阶段链</h2><span class="hint">engine_stages</span></div>
      <div class="card-body" id="stagesBox"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>工作流定义</h2>
        <span class="hint">workflows</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>作业队列（按待办量降序）</h2>
        <span class="hint" id="rowCount">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="theadJobs"></thead>
          <tbody id="tbodyJobs"></tbody>
        </table>
      </div>
    </section>

    <p class="note">
      作业队列按 <span class="mono">stage</span> 分组统计已完成与待处理条数；
      <span class="mono">failed</span> 为 0 说明当前没有卡死作业。引擎阶段链是实验引擎
      状态机的固定顺序，实验按此逐阶段推进。
    </p>
    <footer class="lg-foot"></footer>
  </main>
</div>

<script src="/lab/_shared/lg.js"></script>
<script src="/lab/_shared/editorial.js"></script>
<script>
LG.init('workflow', function (d, el) {
  var jobs = d.jobs || {};
  var byKind = jobs.by_kind || {};

  LG.statCards(el.stats, [
    { value: (d.workflows || []).length, label: '工作流数' },
    { value: jobs.total,   label: '作业总数' },
    { value: jobs.pending, label: '待处理', tone: 'warn', hint: 'pending' },
    { value: jobs.failed,  label: '失败',   tone: jobs.failed ? 'bad' : 'ok', hint: 'failed' },
    { value: (d.engine_stages || []).length, label: '引擎阶段数' }
  ]);

  var stages = d.engine_stages || [];
  LG.$('stagesBox').innerHTML = stages.length
    ? stages.map(function (s, i) {
        return '<span class="tag" style="margin-right:6px">' + (i + 1) + '. ' + LG.esc(s) + '</span>' +
               (i < stages.length - 1 ? '<span style="color:var(--dim)">→</span> ' : '');
      }).join('')
    : '<div class="empty">未登记阶段链</div>';

  LG.table(el.tbody, d.workflows || [], [
    { key: 'id',     label: 'ID' },
    { key: 'name',   label: '名称' },
    { key: 'steps',  label: '阶段数', num: true },
    { key: 'engine', label: '引擎实现' }
  ], { head: el.head });

  var jobRows = Object.keys(byKind).map(function (k) {
    var v = byKind[k] || {};
    return {
      stage: String(k).replace(/^stage:/, ''),
      completed: v.completed || 0,
      pending: v.pending || 0,
      total: (v.completed || 0) + (v.pending || 0)
    };
  }).sort(function (a, b) { return b.pending - a.pending; });

  LG.table(el.tbodyJobs, jobRows, [
    { key: 'stage',     label: '阶段', render: function (r) { return '<span class="mono">' + LG.esc(r.stage) + '</span>'; } },
    { key: 'completed', label: '已完成', num: true },
    { key: 'pending',   label: '待处理', num: true, render: function (r) {
        return r.pending ? '<span class="badge warn">' + LG.fmtNum(r.pending) + '</span>' : '0';
      } },
    { key: 'total',     label: '合计',   num: true }
  ], { head: LG.$('theadJobs'), sortKey: 'total', sortDir: 'desc' });

  LG.$('rowCount').textContent = '共 ' + LG.fmtNum(jobRows.length) + ' 个阶段';
});
</script>
</body>
</html>
