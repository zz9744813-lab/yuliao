<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模型管理 · 中文文风研究台</title>
<script>(function(){try{var t=localStorage.getItem('lg_theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="/lab/_shared/tokens.css">
<link rel="stylesheet" href="/lab/_shared/base.css">
</head>
<body>
<div class="lg-shell">
  <main class="lg-main">
    <div id="banner" class="banner"></div>

    <header class="lg-head">
      <div class="row">
        <h1>模型管理</h1>
        <span class="meta" id="genAt">—</span>
      </div>
      <div class="sub">Models · 实测登记表 / 调用量与令牌消耗 / 串行纪律</div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="card">
      <div class="card-head"><h2>串行纪律</h2><span class="hint">serial_discipline</span></div>
      <div class="card-body" id="serialBox"></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>模型角色登记</h2><span class="hint" id="regMeta">registry</span></div>
      <div class="card-body" id="registryBox"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>调用量明细（按累计调用降序）</h2>
        <span class="hint" id="rowCount">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <footer class="lg-foot"></footer>
  </main>
</div>

<script src="/lab/_shared/lg.js"></script>
<script>
LG.init('models', function (d, el) {
  var reg = d.registry || {};
  var rows = (d.usage_all_time || []).slice().sort(function (a, b) { return (b.calls || 0) - (a.calls || 0); });
  var roles = reg.roles || {};

  LG.statCards(el.stats, [
    { value: d.llm_calls_total, label: '累计 LLM 调用' },
    { value: rows.length,       label: '有过调用的模型', hint: 'usage_all_time' },
    { value: Object.keys(roles).length, label: '登记角色数', hint: 'registry.roles' },
    { value: Object.keys(roles).reduce(function (n, k) { return n + (roles[k] || []).length; }, 0),
      label: '登记模型条目' }
  ]);

  var s = LG.$('serialBox');
  s.innerHTML = d.serial_discipline
    ? '<span class="badge warn">串行</span> <span style="color:var(--fg-2)">' + LG.esc(d.serial_discipline) + '</span>'
    : '<div class="empty">未登记串行纪律</div>';

  var box = LG.$('registryBox');
  var rk = Object.keys(roles);
  if (!rk.length) {
    box.innerHTML = '<div class="empty">登记表为空</div>';
  } else {
    box.innerHTML = rk.map(function (role) {
      var list = (roles[role] || []).map(function (m) {
        return '<span class="tag">' + LG.esc(typeof m === 'string' ? m : (m.model || JSON.stringify(m))) + '</span>';
      }).join('');
      return '<div style="margin-bottom:12px"><div class="badge" style="margin-bottom:6px">' + LG.esc(role) + '</div>' +
             '<div>' + list + '</div></div>';
    }).join('');
    if (reg.note) box.innerHTML += '<p class="note">' + LG.esc(reg.note) + '</p>';
    if (reg.updated) LG.$('regMeta').textContent = 'registry · 更新于 ' + reg.updated;
  }

  LG.table(el.tbody, rows, [
    { key: 'model',       label: '模型' },
    { key: 'calls',       label: '调用数',   num: true },
    { key: 'failed',      label: '失败数',   num: true },
    { key: 'failed_rate', label: '失败率',   num: true, render: function (r) { return LG.fmtPct(r.failed_rate); } },
    { key: 'tokens_in',   label: '输入令牌', num: true },
    { key: 'tokens_out',  label: '输出令牌', num: true }
  ], { head: el.head });

  LG.$('rowCount').textContent = '共 ' + LG.fmtNum(rows.length) + ' 个模型';
});
</script>
</body>
</html>
