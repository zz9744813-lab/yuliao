<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>策略图谱 · 中文文风研究台</title>
<script>(function(){try{var t=localStorage.getItem('lg_theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="/lab/_shared/tokens.css">
<link rel="stylesheet" href="/lab/_shared/base.css">
</head>
<body>
<div class="lg-shell">
  <main class="lg-main">
    <div id="banner" class="banner"></div>

    <header class="lg-head">
      <div class="row">
        <h1>策略图谱</h1>
        <span class="meta" id="genAt">—</span>
      </div>
      <div class="sub">Strategy Atlas · 表达策略聚类 · 规模 / 成功率 / Wilson 区间</div>
    </header>

    <section class="stats" id="stats"></section>

    <div class="grid-2">
      <section class="card">
        <div class="card-head"><h2>聚类方法</h2><span class="hint">by_method</span></div>
        <div class="card-body"><div class="bars" id="barsMethod"></div></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>聚类规模</h2><span class="hint">top_by_size.n_items</span></div>
        <div class="card-body"><div class="bars" id="barsSize"></div></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head">
        <h2>策略明细（按条目数降序）</h2>
        <span class="hint" id="rowCount">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <p class="note">
      Wilson 区间是成功率的 95% 置信下界/上界——区间宽说明样本少，别只看点估计。
      策略来自表达层聚类，供"哪种写法更常被偏好"参考，不构成因果结论。
    </p>
    <footer class="lg-foot"></footer>
  </main>
</div>

<script src="/lab/_shared/lg.js"></script>
<script>
LG.init('strategy-atlas', function (d, el) {
  var rows = d.top_by_size || [];
  var sizeMap = {};
  rows.forEach(function (r) { sizeMap[r.name] = r.n_items; });

  LG.statCards(el.stats, [
    { value: d.strategies,          label: '策略总数' },
    { value: d.cluster_items_total, label: '归属条目总数', hint: 'cluster_items_total' },
    { value: rows.length,           label: '本页展示', hint: 'top_by_size' },
    { value: Object.keys(d.by_method || {}).length, label: '聚类方法数' }
  ]);

  LG.bars(LG.$('barsMethod'), d.by_method || {});
  LG.bars(LG.$('barsSize'), sizeMap);

  LG.table(el.tbody, rows, [
    { key: 'name',         label: '策略名' },
    { key: 'method',       label: '方法' },
    { key: 'n_items',      label: '条目数', num: true },
    { key: 'success_rate', label: '成功率', num: true, render: function (r) { return LG.fmtPct(r.success_rate); } },
    { key: 'wilson',       label: 'Wilson 95% 区间', num: true, render: function (r) {
        var w = r.wilson;
        return (Array.isArray(w) && w.length === 2) ? (LG.fmtPct(w[0]) + ' ~ ' + LG.fmtPct(w[1])) : '—';
      } },
    { key: 'version',      label: '版本' },
    { key: 'id',           label: 'ID', num: true }
  ], { head: el.head });

  LG.$('rowCount').textContent = '共 ' + LG.fmtNum(rows.length) + ' 个（Top N）';
});
</script>
</body>
</html>
