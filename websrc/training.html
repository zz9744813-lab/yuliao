<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>训练数据 · 中文文风研究台</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0e1116; color:#c9d1d9;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:24px; min-height:100vh;
  }
  .wrap { max-width:1200px; margin:0 auto; }
  header h1 { font-size:22px; font-weight:600; color:#e6edf3; }
  header p { font-size:13px; color:#8b949e; margin-top:6px; }
  .banner {
    display:none; margin-top:16px; padding:10px 14px;
    background:rgba(210,153,34,.12); border:1px solid #d29922;
    color:#e3b341; border-radius:10px; font-size:13px;
  }
  .cards {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:14px; margin-top:20px;
  }
  .card {
    background:#161b22; border:1px solid #263041; border-radius:10px;
    padding:18px 20px;
  }
  .card .val {
    font-size:28px; font-weight:700; color:#58a6ff;
    font-variant-numeric:tabular-nums; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .card .lbl { font-size:12px; color:#8b949e; margin-top:6px; }
  .panel {
    margin-top:22px; background:#161b22; border:1px solid #263041;
    border-radius:10px; overflow:hidden;
  }
  .panel h2 {
    font-size:14px; font-weight:600; color:#e6edf3;
    padding:14px 18px; border-bottom:1px solid #263041;
  }
  .table-scroll { overflow:auto; max-height:520px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th {
    position:sticky; top:0; z-index:2;
    background:#161b22; color:#8b949e; font-weight:600; text-align:left;
    padding:10px 16px; border-bottom:1px solid #263041; white-space:nowrap;
  }
  tbody td {
    padding:10px 16px; border-bottom:1px solid #21262e; white-space:nowrap;
  }
  tbody tr:hover { background:#1c2330; }
  td.num { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums; }
  .tag {
    display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px;
    border:1px solid #263041; color:#58a6ff; background:rgba(88,166,255,.08);
  }
  .empty { padding:40px; text-align:center; color:#8b949e; font-size:13px; }
  .note { margin-top:14px; font-size:12px; color:#8b949e; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>训练数据</h1>
    <p>SFT / DPO / RM / Rewrite 导出物 · 条数 · 体积 · 最近导出时间</p>
  </header>
  <div class="banner" id="banner">数据接口不可用，以下为示例结构</div>

  <div class="cards" id="cards"></div>

  <div class="panel">
    <h2>导出物清单</h2>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>导出物</th><th>类型</th><th>条数</th><th>体积</th><th>最近导出时间</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">暂无数据</div>
    </div>
  </div>
  <div class="note" id="note"></div>
</div>

<script>
(function(){
  var banner = document.getElementById('banner');
  var cardsEl = document.getElementById('cards');
  var tbody = document.getElementById('tbody');
  var emptyEl = document.getElementById('empty');
  var noteEl = document.getElementById('note');

  function fmtNum(n){
    if (typeof n !== 'number' || isNaN(n)) return '—';
    return n.toLocaleString('zh-CN');
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function renderStats(stats){
    cardsEl.innerHTML = '';
    if (!Array.isArray(stats) || !stats.length){
      ['SFT 条数','DPO 条数','RM 条数','Rewrite 条数'].forEach(function(l){
        cardsEl.innerHTML += '<div class="card"><div class="val">—</div><div class="lbl">'+esc(l)+'</div></div>';
      });
      return;
    }
    stats.forEach(function(s){
      var v = (typeof s.value === 'number') ? fmtNum(s.value) : esc(s.value);
      cardsEl.innerHTML += '<div class="card"><div class="val">'+v+'</div><div class="lbl">'+esc(s.label)+'</div></div>';
    });
  }

  function renderRows(rows){
    tbody.innerHTML = '';
    if (!Array.isArray(rows) || !rows.length){
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';
    rows.forEach(function(r){
      var tr = document.createElement('tr');
      var cells = [
        '<td>'+esc(r.name || r.artifact || r.file || '—')+'</td>',
        '<td><span class="tag">'+esc(r.type || r.kind || '—')+'</span></td>',
        '<td class="num">'+fmtNum(r.count != null ? r.count : r.rows)+'</td>',
        '<td class="num">'+esc(r.size || r.bytes_human || '—')+'</td>',
        '<td class="num">'+esc(r.exported_at || r.updated_at || '—')+'</td>'
      ];
      tr.innerHTML = cells.join('');
      tbody.appendChild(tr);
    });
  }

  function renderEmpty(){
    renderStats(null);
    renderRows([]);
  }

  fetch('/console/training')
    .then(function(res){
      if (!res.ok) throw new Error('HTTP '+res.status);
      return res.json();
    })
    .then(function(data){
      renderStats(data.stats);
      renderRows(data.rows);
      if (data.note) noteEl.textContent = data.note;
      if (data.generated_at) noteEl.textContent = (noteEl.textContent ? noteEl.textContent + ' · ' : '') + '生成时间：' + data.generated_at;
    })
    .catch(function(){
      banner.style.display = 'block';
      renderEmpty();
    });
})();
</script>
</body>
</html>
