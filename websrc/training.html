<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>训练数据 · 中文文风研究台</title>
<script>(function(){try{var t=localStorage.getItem('lg_theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="/lab/_shared/tokens.css">
<link rel="stylesheet" href="/lab/_shared/base.css">
</head>
<body>
<div class="lg-shell">
  <main class="lg-main">
    <div id="banner" class="banner"></div>

    <header class="lg-head">
      <div class="row">
        <h1>训练数据</h1>
        <span class="meta" id="genAt">—</span>
      </div>
      <div class="sub">Training Data · 导出物清单 / 扰动样本库 / 负面池 / 隔离审计</div>
    </header>

    <section class="stats" id="stats"></section>

    <div class="grid-2">
      <section class="card">
        <div class="card-head"><h2>扰动样本状态</h2><span class="hint">corruptions.by_status</span></div>
        <div class="card-body"><div class="bars" id="barsCorrupt"></div></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>口径备注</h2><span class="hint">sft_note / benchmark_isolation</span></div>
        <div class="card-body" id="notesBox"></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head">
        <h2>导出物清单（按体积降序）</h2>
        <span class="hint" id="rowCount">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <p class="note">
      导出物是训练管线的输入（SFT / DPO / RM / rewrite 口径）。体积只反映文件大小，
      条数口径见各导出器说明；<span class="mono">rejected_*</span> 是在闸门处被拦下的样本，
      不是"报废"——它们记录了闸门的实际拦下量。
    </p>
    <footer class="lg-foot"></footer>
  </main>
</div>

<script src="/lab/_shared/lg.js"></script>
<script>
LG.init('training-data', function (d, el) {
  var cor = d.corruptions || {};
  var cs = cor.by_status || {};
  var files = (d.export_files || []).slice().sort(function (a, b) { return (b.bytes || 0) - (a.bytes || 0); });
  var totalBytes = files.reduce(function (n, f) { return n + (f.bytes || 0); }, 0);

  LG.statCards(el.stats, [
    { value: files.length,                 label: '导出物数' },
    { value: Math.round(totalBytes / 1048576 * 10) / 10, label: '导出总体积 MB', hint: LG.fmtBytes(totalBytes) },
    { value: cor.total,                    label: '扰动样本总数', hint: 'corruptions.total' },
    { value: cs.ok,                        label: '扰动合格', tone: 'ok',  hint: 'by_status.ok' },
    { value: cs.failed,                    label: '扰动失败', tone: 'bad', hint: 'by_status.failed' },
    { value: d.negative_pool_eligible,     label: '负面池可用', hint: 'negative_pool_eligible' }
  ]);

  LG.bars(LG.$('barsCorrupt'), cs);

  var notes = LG.$('notesBox');
  var parts = [];
  if (d.sft_note) parts.push('<div style="margin-bottom:8px"><span class="badge">SFT</span> <span style="color:var(--fg-2)">' + LG.esc(d.sft_note) + '</span></div>');
  if (d.benchmark_isolation) parts.push('<div><span class="badge warn">隔离</span> <span style="color:var(--fg-2)">' + LG.esc(d.benchmark_isolation) + '</span></div>');
  notes.innerHTML = parts.length ? parts.join('') : '<div class="empty">未登记备注</div>';

  LG.table(el.tbody, files, [
    { key: 'file',  label: '文件名', render: function (r) { return '<span class="mono">' + LG.esc(r.file) + '</span>'; } },
    { key: 'bytes', label: '体积',   num: true, render: function (r) { return LG.fmtBytes(r.bytes); } }
  ], { head: el.head });

  LG.$('rowCount').textContent = '共 ' + LG.fmtNum(files.length) + ' 个';
});
</script>
</body>
</html>
