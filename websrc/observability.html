<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可观测 · 中文文风研究台</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0e1116; color:#c9d1d9;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px; min-height:100vh;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 600; color:#e6edf3; }
  .sub { font-size: 13px; color:#8b949e; margin-top: 4px; }
  .warn {
    display:none; background: rgba(210,153,34,.12); border:1px solid #9e6a03;
    color:#e3b341; font-size:13px; padding:8px 14px; border-radius:10px; margin-bottom:16px;
  }
  .cards { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:14px; margin-bottom:20px; }
  .card {
    background:#161b22; border:1px solid #263041; border-radius:10px; padding:16px 18px;
  }
  .card .val {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:26px; font-weight:600; color:#58a6ff; font-variant-numeric: tabular-nums;
  }
  .card .lbl { font-size:12px; color:#8b949e; margin-top:6px; }
  .panel {
    background:#161b22; border:1px solid #263041; border-radius:10px; overflow:hidden;
  }
  .panel-head {
    padding:12px 16px; border-bottom:1px solid #263041; font-size:14px; font-weight:600; color:#e6edf3;
    display:flex; justify-content:space-between; align-items:center;
  }
  .panel-head .ts { font-size:12px; color:#8b949e; font-weight:400; font-family: ui-monospace, Menlo, monospace; }
  .tbl-wrap { overflow-x:auto; max-height: 560px; overflow-y:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th {
    position:sticky; top:0; background:#161b22; z-index:2;
    text-align:left; padding:10px 14px; color:#8b949e; font-weight:500; font-size:12px;
    border-bottom:1px solid #263041; white-space:nowrap;
  }
  tbody td { padding:10px 14px; border-bottom:1px solid #21262d; white-space:nowrap; }
  tbody tr:hover { background:#1c2129; }
  .num { font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; text-align:right; }
  th.num { text-align:right; }
  .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; }
  .b-ok { background:rgba(63,185,80,.15); color:#3fb950; border:1px solid rgba(63,185,80,.3); }
  .b-err { background:rgba(248,81,73,.15); color:#f85149; border:1px solid rgba(248,81,73,.3); }
  .b-warn { background:rgba(210,153,34,.15); color:#e3b341; border:1px solid rgba(210,153,34,.3); }
  .empty { padding:40px; text-align:center; color:#8b949e; font-size:13px; }
  .bar-cell { min-width:140px; }
  .bar-track { background:#21262d; border-radius:4px; height:8px; overflow:hidden; }
  .bar-fill { height:100%; background:#58a6ff; border-radius:4px; }
  .note { font-size:12px; color:#8b949e; padding:10px 16px; border-top:1px solid #263041; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>可观测 · LLM 调用实时统计</h1>
    <div class="sub">按模型 / 用途 / 状态维度统计调用量、延迟与失败率（llm_calls）</div>
  </header>

  <div class="warn" id="warn">数据接口不可用，以下为示例结构</div>

  <div class="cards" id="cards"></div>

  <div class="panel">
    <div class="panel-head">
      <span>调用明细（模型 × 用途 × 状态）</span>
      <span class="ts" id="ts"></span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>模型</th>
            <th>用途</th>
            <th>状态</th>
            <th class="num">调用量</th>
            <th class="num">平均延迟 (ms)</th>
            <th class="num">P95 延迟 (ms)</th>
            <th class="num">失败率</th>
            <th>调用量占比</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none;">暂无数据</div>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>

<script>
const fmt = n => (typeof n === 'number' && isFinite(n)) ? n.toLocaleString('zh-CN') : '—';
const fmtPct = n => (typeof n === 'number' && isFinite(n)) ? (n * 100).toFixed(2) + '%' : '—';

function statusBadge(s) {
  const v = String(s || '').toLowerCase();
  if (['success','ok','成功','200'].includes(v)) return '<span class="badge b-ok">成功</span>';
  if (['error','fail','failed','失败'].includes(v)) return '<span class="badge b-err">失败</span>';
  return '<span class="badge b-warn">' + (s || '未知') + '</span>';
}

function render(data) {
  // 统计卡
  const cards = document.getElementById('cards');
  const stats = Array.isArray(data.stats) ? data.stats : [];
  if (stats.length) {
    cards.innerHTML = stats.map(s =>
      '<div class="card"><div class="val">' + fmt(s.value) + '</div><div class="lbl">' + (s.label || '') + '</div></div>'
    ).join('');
  } else {
    cards.innerHTML = ['总调用量','成功率','平均延迟 (ms)','失败调用数']
      .map(l => '<div class="card"><div class="val">—</div><div class="lbl">' + l + '</div></div>').join('');
  }

  // 表格
  const rows = Array.isArray(data.rows) ? data.rows : [];
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');
  if (!rows.length) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    const total = rows.reduce((a, r) => a + (Number(r.calls) || 0), 0) || 1;
    tbody.innerHTML = rows.map(r => {
      const calls = Number(r.calls) || 0;
      const pct = Math.min(100, calls / total * 100);
      return '<tr>' +
        '<td>' + (r.model || '—') + '</td>' +
        '<td>' + (r.purpose || '—') + '</td>' +
        '<td>' + statusBadge(r.status) + '</td>' +
        '<td class="num">' + fmt(calls) + '</td>' +
        '<td class="num">' + fmt(r.avg_latency_ms) + '</td>' +
        '<td class="num">' + fmt(r.p95_latency_ms) + '</td>' +
        '<td class="num">' + fmtPct(r.failure_rate) + '</td>' +
        '<td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:' + pct.toFixed(1) + '%"></div></div></td>' +
      '</tr>';
    }).join('');
  }

  document.getElementById('ts').textContent = data.generated_at ? ('数据时间：' + data.generated_at) : '';
  document.getElementById('note').textContent = data.note || '';
}

fetch('/console/observability')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => {
    document.getElementById('warn').style.display = 'block';
    render({ stats: [], rows: [], note: '' });
  });
</script>
</body>
</html>
