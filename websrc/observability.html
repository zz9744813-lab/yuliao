<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可观测 · 中文文风研究台</title>
<script>(function(){try{var t=localStorage.getItem('lg_theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="/lab/_shared/tokens.css">
<link rel="stylesheet" href="/lab/_shared/base.css">
</head>
<body>
<div class="lg-shell">
  <main class="lg-main">
    <div id="banner" class="banner"></div>

    <header class="lg-head">
      <div class="row">
        <h1>可观测</h1>
        <span class="meta" id="genAt">—</span>
      </div>
      <div class="sub">Observability · 近窗口 LLM 调用全景：成功率 / 令牌 / 延迟分位 / 错误榜</div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="card">
      <div class="card-head"><h2>时间窗与对照</h2><span class="hint">snapshot.window / n_full_table</span></div>
      <div class="card-body" id="windowBox"></div>
    </section>

    <div class="grid-2">
      <section class="card">
        <div class="card-head"><h2>调用状态</h2><span class="hint">by_status</span></div>
        <div class="card-body"><div class="bars" id="barsStatus"></div></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>调用用途</h2><span class="hint">by_purpose</span></div>
        <div class="card-body"><div class="bars" id="barsPurpose"></div></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head"><h2>逐小时调用量</h2><span class="hint">by_hour</span></div>
      <div class="card-body"><div class="bars" id="barsHour"></div></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>模型明细（按窗口内调用降序）</h2>
        <span class="hint" id="rowCount">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>错误榜</h2>
        <span class="hint" id="errMeta">errors_top</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="theadErr"></thead>
          <tbody id="tbodyErr"></tbody>
        </table>
      </div>
    </section>

    <footer class="lg-foot"></footer>
  </main>
</div>

<script src="/lab/_shared/lg.js"></script>
<script>
LG.init('observability', function (d, el) {
  var s = d.snapshot || {};
  var lat = s.latency_ms || {};
  var errors = s.errors_top || {};

  LG.statCards(el.stats, [
    { value: s.n,            label: '窗口内调用', hint: '近 ' + LG.fmtNum(d.window_hours) + ' 小时' },
    { value: s.ok,           label: '成功', tone: 'ok',  hint: 'ok' },
    { value: s.failed,       label: '失败', tone: 'bad', hint: 'failed' },
    { value: s.success_rate == null ? null : Math.round(s.success_rate * 1000) / 10, label: '成功率 %', tone: 'accent' },
    { value: Math.round((s.tokens_total || 0) / 1000), label: '令牌总量 K', hint: 'tokens_total' },
    { value: lat.p50 == null ? null : Math.round(lat.p50 / 1000 * 10) / 10, label: '延迟 p50 秒' },
    { value: lat.p95 == null ? null : Math.round(lat.p95 / 1000 * 10) / 10, label: '延迟 p95 秒' },
    { value: s.n_full_table, label: '全表调用数', hint: '对照：不设时间窗' }
  ]);

  LG.$('windowBox').innerHTML =
    '<div class="bar-row"><div class="k">窗口</div><div style="color:var(--fg-2)">' +
      LG.esc(LG.fmtTime(s.since)) + ' → ' + LG.esc(LG.fmtTime(s.now)) +
      '（' + LG.fmtNum(s.hours) + ' 小时' + (s.exp ? '，实验 ' + LG.esc(s.exp) : '，不限实验') + '）</div><div class="v"></div></div>' +
    '<p class="note">窗口内调用 <span class="mono">' + LG.fmtNum(s.n) + '</span> 条，全表 <span class="mono">' +
      LG.fmtNum(s.n_full_table) + '</span> 条 —— 两个数并列是为了让"窗口读数"和"全量"一眼可分，别把全表数当窗口数。</p>';

  LG.bars(LG.$('barsStatus'), s.by_status || {});

  var purposeN = {};
  Object.keys(s.by_purpose || {}).forEach(function (k) {
    var v = s.by_purpose[k];
    purposeN[k] = (v && typeof v === 'object') ? (v.n || v.calls || 0) : v;
  });
  LG.bars(LG.$('barsPurpose'), purposeN);

  var hourN = {};
  (s.by_hour || []).forEach(function (h) {
    if (h && h.hour) hourN[String(h.hour).slice(11) + ':00'] = h.n || h.calls || 0;
  });
  LG.bars(LG.$('barsHour'), hourN);

  var models = Object.keys(s.by_model || {}).map(function (m) {
    var v = s.by_model[m] || {};
    return {
      model: m, n: v.n, ok: v.ok, failed: v.failed, success_rate: v.success_rate,
      tokens_total: v.tokens_total, p50: v.latency_ms ? v.latency_ms.p50 : null
    };
  }).sort(function (a, b) { return (b.n || 0) - (a.n || 0); });

  LG.table(el.tbody, models, [
    { key: 'model',        label: '模型' },
    { key: 'n',            label: '调用',   num: true },
    { key: 'ok',           label: '成功',   num: true },
    { key: 'failed',       label: '失败',   num: true, render: function (r) {
        return r.failed ? '<span class="badge bad">' + LG.fmtNum(r.failed) + '</span>' : '0';
      } },
    { key: 'success_rate', label: '成功率', num: true, render: function (r) { return LG.fmtPct(r.success_rate); } },
    { key: 'tokens_total', label: '令牌',   num: true },
    { key: 'p50',          label: 'p50 秒', num: true, render: function (r) {
        return r.p50 == null ? '—' : (Math.round(r.p50 / 1000 * 10) / 10) + '';
      } }
  ], { head: el.head, sortKey: 'n', sortDir: 'desc' });

  LG.$('rowCount').textContent = '共 ' + LG.fmtNum(models.length) + ' 个模型';

  var items = (errors.items || []).slice();
  LG.table(el.tbodyErr, items, [
    { key: 'n', label: '次数', num: true, render: function (r) {
        return '<span class="badge bad">' + LG.fmtNum(r.n) + '</span>';
      } },
    { key: 'error', label: '错误摘要', render: function (r) {
        var t = String(r.error == null ? '' : r.error);
        return '<div class="mono" style="font-size:11.5px">' + LG.esc(t.length > 130 ? t.slice(0, 130) + '…' : t) + '</div>';
      } },
    { key: 'purposes', label: '涉及用途', render: function (r) {
        return (r.purposes || []).map(function (p) { return '<span class="tag">' + LG.esc(p) + '</span>'; }).join('');
      } },
    { key: 'models', label: '涉及模型', render: function (r) {
        return (r.models || []).map(function (m) { return '<span class="tag">' + LG.esc(m) + '</span>'; }).join('');
      } }
  ], { head: LG.$('theadErr') });

  LG.$('errMeta').textContent = '失败 ' + LG.fmtNum(errors.n_failed_rows) + ' 条 / ' +
    LG.fmtNum(errors.n_distinct_errors) + ' 类（Top ' + LG.fmtNum(errors.top_n) + '）';
});
</script>
</body>
</html>
