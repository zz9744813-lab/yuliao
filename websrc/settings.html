<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置与交接 · 语言基因组</title>
<script>(function(){try{var t=localStorage.getItem('lg_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="/lab/_shared/tokens.css">
<link rel="stylesheet" href="/lab/_shared/base.css">
<link rel="stylesheet" href="/lab/_shared/editorial.css">
</head>
<body>
<div class="lg-shell">
  <main class="lg-main">
    <div id="banner" class="banner"></div>

    <header class="lg-head">
      <div class="row">
        <h1>设置与交接</h1>
        <span class="meta" id="genAt">—</span>
      </div>
      <div class="sub">Settings · 运行模式 / 版本白名单 / 模型清单 / 只读与密钥策略</div>
    </header>

    <section class="stats" id="stats"></section>

    <div class="grid-2">
      <section class="card">
        <div class="card-head"><h2>盲评口径白名单</h2><span class="hint">blind_review_prompt_versions</span></div>
        <div class="card-body" id="blindBox"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>可服务提示词版本</h2><span class="hint">servable_prompt_versions</span></div>
        <div class="card-body" id="servBox"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>抽取模型</h2><span class="hint">extractor_models</span></div>
        <div class="card-body" id="extractBox"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>默认重建模型</h2><span class="hint">default_recon_models</span></div>
        <div class="card-body" id="reconBox"></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head"><h2>模块注册表</h2><span class="hint">modules（16 项，导航即按此渲染）</span></div>
      <div class="card-body" id="modulesBox"></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>安全与只读</h2><span class="hint">secrets_policy / readonly</span></div>
      <div class="card-body" id="secBox"></div>
    </section>

    <footer class="lg-foot"></footer>
  </main>
</div>

<script src="/lab/_shared/lg.js"></script>
<script src="/lab/_shared/editorial.js"></script>
<script>
LG.init('settings', function (d, el) {
  LG.statCards(el.stats, [
    { value: d.llm_mode,          label: 'LLM 模式', hint: 'llm_mode' },
    { value: d.database_backend,  label: '数据库后端', hint: 'database_backend' },
    { value: d.readonly ? '只读' : '可写', label: '研究台权限', hint: 'readonly' },
    { value: (d.modules || []).length, label: '注册模块数' },
    { value: (d.blind_review_prompt_versions || []).length, label: '盲评口径版本数' },
    { value: (d.default_recon_models || []).length, label: '默认重建模型数' }
  ]);

  function tags(box, arr) {
    box.innerHTML = (arr && arr.length)
      ? arr.map(function (x) { return '<span class="tag">' + LG.esc(typeof x === 'string' ? x : JSON.stringify(x)) + '</span>'; }).join('')
      : '<div class="empty">未登记</div>';
  }
  tags(LG.$('blindBox'), d.blind_review_prompt_versions);
  tags(LG.$('servBox'), d.servable_prompt_versions);
  tags(LG.$('extractBox'), d.extractor_models);
  tags(LG.$('reconBox'), d.default_recon_models);
  tags(LG.$('modulesBox'), d.modules);

  LG.$('secBox').innerHTML =
    '<div style="margin-bottom:10px"><span class="badge ' + (d.readonly ? 'ok' : 'bad') + '">' +
      (d.readonly ? '只读' : '可写') + '</span> <span style="color:var(--fg-2)">' +
      (d.readonly ? '研究台全部接口为 GET-only，写操作只在盲评台与命令行' : '警告：存在写路径') + '</span></div>' +
    '<div style="margin-bottom:10px"><span class="badge warn">密钥</span> <span style="color:var(--fg-2)">' +
      LG.esc(d.secrets_policy || '未登记') + '</span></div>' +
    '<div><span class="badge">数据目录</span> <span class="mono" style="color:var(--fg-2)">' +
      LG.esc(d.data_dir || '—') + '</span></div>';
});
</script>
</body>
</html>
