<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语料库 · 语言基因组</title>
<script>(function(){try{var t=localStorage.getItem('lg_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="/lab/_shared/tokens.css">
<link rel="stylesheet" href="/lab/_shared/base.css">
<link rel="stylesheet" href="/lab/_shared/editorial.css">
</head>
<body>
<div class="lg-shell">
  <main class="lg-main">
    <div id="banner" class="banner"></div>

    <header class="lg-head">
      <div class="row">
        <h1>语料库</h1>
        <span class="meta" id="genAt">—</span>
      </div>
      <div class="sub">作品 · 段落规模 / 来源完整性 / 角色与版本分布</div>
    </header>

    <section class="stats" id="stats"></section>

    <div class="grid-2">
      <section class="card">
        <div class="card-head"><h2>来源完整性</h2><span class="hint">integrity</span></div>
        <div class="card-body"><div class="bars" id="barsIntegrity"></div></div>
      </section>

      <section class="card">
        <div class="card-head"><h2>段落版本分布</h2><span class="hint">seg_versions</span></div>
        <div class="card-body"><div class="bars" id="barsVersions"></div></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head"><h2>作品（按段落数降序）</h2><span class="hint" id="rowCount">—</span></div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <p class="note" id="note"></p>
    <footer class="lg-foot"></footer>
  </main>
</div>

<script src="/lab/_shared/lg.js"></script>
<script src="/lab/_shared/editorial.js"></script>
<script>
LG.init('corpus', function (d, el) {
  var ig = d.integrity || {};

  LG.statCards(el.stats, [
    { value: d.works,        label: '作品数' },
    { value: d.segments,     label: '段落总数', hint: 'segments' },
    { value: d.chars_total,  label: '总字数' },
    { value: d.text_cleaned, label: '已清洗段落', hint: 'text_cleaned' },
    { value: ig.src_ok,      label: '来源合格', tone: 'ok',   hint: 'src_ok' },
    { value: ig.src_bad,     label: '坏源段落', tone: 'bad',  hint: 'src_bad（闸门拦下）' },
    { value: ig.unchecked,   label: '未校勘',   hint: 'unchecked' },
    { value: ig.checked,     label: '已校勘合计', hint: 'checked' }
  ]);

  LG.bars(LG.$('barsIntegrity'), ig);
  LG.bars(LG.$('barsVersions'), d.seg_versions || {});

  var works = (d.recent_works || []).slice().sort(function (a, b) { return (b.segments || 0) - (a.segments || 0); });
  LG.table(el.tbody, works, [
    { key: 'id',       label: 'ID',     num: true },
    { key: 'title',    label: '作品' },
    { key: 'author',   label: '作者' },
    { key: 'segments', label: '段落数', num: true }
  ], { head: el.head });

  LG.$('rowCount').textContent = '共 ' + LG.fmtNum(works.length) + ' 部（近段）';
  LG.$('note').textContent = '角色分布：' + Object.keys(d.roles || {}).map(function (k) {
    return (k === '∅' || k === '' ? '（无角色）' : k) + ' ' + LG.fmtNum(d.roles[k]);
  }).join('　·　') + '。基准段 role=benchmark 不进训练导出。';
});
</script>
</body>
</html>
