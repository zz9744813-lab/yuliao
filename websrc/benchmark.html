<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基准与回归 · 中文文风研究台</title>
<script>(function(){try{var t=localStorage.getItem('lg_theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="/lab/_shared/tokens.css">
<link rel="stylesheet" href="/lab/_shared/base.css">
</head>
<body>
<div class="lg-shell">
  <main class="lg-main">
    <div id="banner" class="banner"></div>

    <header class="lg-head">
      <div class="row">
        <h1>基准与回归</h1>
        <span class="meta" id="genAt">—</span>
      </div>
      <div class="sub">Benchmarks · 冻结集合 / 模型排行榜 / 题型分布 / 隔离规则</div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="card">
      <div class="card-head"><h2>隔离规则</h2><span class="hint">hidden_rule</span></div>
      <div class="card-body" id="ruleBox"></div>
    </section>

    <div class="grid-2">
      <section class="card">
        <div class="card-head"><h2>模型排行榜</h2><span class="hint">leaderboard.avg_accuracy</span></div>
        <div class="card-body"><div class="bars" id="barsBoard"></div></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>题型条目分布</h2><span class="hint">latest_by_type</span></div>
        <div class="card-body"><div class="bars" id="barsType"></div></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head">
        <h2>排行榜明细</h2>
        <span class="hint" id="rowCount">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>冻结集合（按创建时间降序）</h2>
        <span class="hint" id="setCount">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="theadSets"></thead>
          <tbody id="tbodySets"></tbody>
        </table>
      </div>
    </section>

    <footer class="lg-foot"></footer>
  </main>
</div>

<script src="/lab/_shared/lg.js"></script>
<script>
LG.init('benchmarks', function (d, el) {
  var board = (d.leaderboard || []).slice().sort(function (a, b) { return (b.avg_accuracy || 0) - (a.avg_accuracy || 0); });
  var sets = (d.sets || []).slice().sort(function (a, b) {
    return String(b.created_at || '').localeCompare(String(a.created_at || ''));
  });
  var byType = d.latest_by_type || {};
  delete byType[''];

  var boardMap = {};
  board.forEach(function (r) { boardMap[r.model] = Math.round((r.avg_accuracy || 0) * 1000) / 10; });

  LG.statCards(el.stats, [
    { value: d.items,        label: '基准题目', hint: 'items' },
    { value: d.runs,         label: '跑分记录', hint: 'runs' },
    { value: sets.length,    label: '冻结集合数' },
    { value: board.length,   label: '在榜模型数' },
    { value: board.length && board[0] ? board[0].model : null, label: '榜首模型', tone: 'accent',
      hint: board.length && board[0] ? ('均值准确率 ' + LG.fmtPct(board[0].avg_accuracy)) : '' }
  ]);

  var rule = LG.$('ruleBox');
  rule.innerHTML = d.hidden_rule
    ? '<span class="badge warn">隔离</span> <span style="color:var(--fg-2)">' + LG.esc(d.hidden_rule) + '</span>'
    : '<div class="empty">未登记隔离规则</div>';

  LG.bars(LG.$('barsBoard'), boardMap);
  LG.bars(LG.$('barsType'), byType);

  LG.table(el.tbody, board, [
    { key: 'model',        label: '模型' },
    { key: 'avg_accuracy', label: '均值准确率', num: true, render: function (r) { return LG.fmtPct(r.avg_accuracy); } },
    { key: 'best',         label: '最好',       num: true, render: function (r) { return LG.fmtPct(r.best); } },
    { key: 'runs',         label: '跑分次数',   num: true }
  ], { head: el.head });

  LG.table(el.tbodySets, sets, [
    { key: 'id',         label: 'ID' },
    { key: 'name',       label: '名称' },
    { key: 'kind',       label: '类型' },
    { key: 'version',    label: '版本' },
    { key: 'n_items',    label: '题目数', num: true },
    { key: 'created_at', label: '创建时间', fmt: 'time' }
  ], { head: LG.$('theadSets') });

  LG.$('rowCount').textContent = LG.fmtNum(board.length) + ' 条';
  LG.$('setCount').textContent = LG.fmtNum(sets.length) + ' 个';
});
</script>
</body>
</html>
