<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基准与回归 · 中文文风研究台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e1116;
    color: #c9d1d9;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px;
    min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 600; color: #e6edf3; }
  .subtitle { color: #8b949e; font-size: 13px; margin-top: 6px; }
  .banner {
    display: none;
    background: rgba(210, 153, 34, 0.12);
    border: 1px solid #9e6a03;
    color: #e3b341;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: #161b22;
    border: 1px solid #263041;
    border-radius: 10px;
    padding: 18px;
  }
  .stat-value {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 28px;
    font-weight: 600;
    color: #58a6ff;
    line-height: 1.2;
  }
  .stat-label { font-size: 12px; color: #8b949e; margin-top: 6px; }
  .panel {
    background: #161b22;
    border: 1px solid #263041;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .panel-title {
    padding: 14px 18px;
    font-size: 14px;
    font-weight: 600;
    color: #e6edf3;
    border-bottom: 1px solid #263041;
  }
  .table-wrap { overflow-x: auto; max-height: 520px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    position: sticky;
    top: 0;
    background: #1c2330;
    color: #8b949e;
    font-weight: 600;
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid #263041;
    white-space: nowrap;
    z-index: 1;
  }
  tbody td {
    padding: 10px 14px;
    border-bottom: 1px solid #21262e;
    color: #c9d1d9;
  }
  tbody tr:hover { background: #1a212b; }
  .num { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .bar-cell { min-width: 160px; }
  .bar-track {
    background: #21262e;
    border-radius: 4px;
    height: 8px;
    width: 100%;
    overflow: hidden;
  }
  .bar-fill { background: #58a6ff; height: 100%; border-radius: 4px; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 12px;
    border: 1px solid #263041;
  }
  .badge-pass { color: #3fb950; border-color: #238636; background: rgba(63,185,80,.1); }
  .badge-fail { color: #f85149; border-color: #da3633; background: rgba(248,81,73,.1); }
  .badge-hidden { color: #d29922; border-color: #9e6a03; background: rgba(210,153,34,.1); }
  .empty { text-align: center; color: #8b949e; padding: 40px 0; font-size: 13px; }
  .note { color: #8b949e; font-size: 12px; margin-top: 16px; }
  .meta { color: #8b949e; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>基准与回归</h1>
    <div class="subtitle">中文文风研究台（Language Genome）· cc-v1 等题集通过率、子类别细分与隐藏集状态</div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="banner" id="banner">数据接口不可用，以下为示例结构</div>

  <div class="stats-grid" id="statsGrid"></div>

  <div class="panel">
    <div class="panel-title">题集 / 子类别通过率明细</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>题集</th>
            <th>子类别</th>
            <th>样本数</th>
            <th>通过数</th>
            <th>通过率</th>
            <th style="width:180px">分布</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="7" class="empty">暂无数据</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="note" id="note"></div>
</div>

<script>
(function () {
  var banner = document.getElementById('banner');
  var statsGrid = document.getElementById('statsGrid');
  var tbody = document.getElementById('tbody');
  var noteEl = document.getElementById('note');
  var metaEl = document.getElementById('meta');

  function fmt(n) {
    if (typeof n !== 'number' || isNaN(n)) return '—';
    return n.toLocaleString('zh-CN');
  }

  function pct(v) {
    if (typeof v !== 'number' || isNaN(v)) return '—';
    var p = v <= 1 ? v * 100 : v;
    return p.toFixed(1) + '%';
  }

  function renderStats(stats) {
    statsGrid.innerHTML = '';
    if (!Array.isArray(stats) || stats.length === 0) {
      statsGrid.innerHTML = '<div class="stat-card"><div class="stat-value">—</div><div class="stat-label">暂无数据</div></div>';
      return;
    }
    stats.forEach(function (s) {
      var card = document.createElement('div');
      card.className = 'stat-card';
      var v = (typeof s.value === 'number') ? fmt(s.value) : (s.value == null ? '—' : String(s.value));
      card.innerHTML = '<div class="stat-value">' + v + '</div><div class="stat-label">' +
        (s.label || '') + '</div>';
      statsGrid.appendChild(card);
    });
  }

  function statusBadge(r) {
    var st = (r.status || r.state || '').toString().toLowerCase();
    if (r.hidden === true || st === 'hidden') return '<span class="badge badge-hidden">隐藏集</span>';
    if (st === 'pass' || st === 'passed' || st === 'ok') return '<span class="badge badge-pass">通过</span>';
    if (st === 'fail' || st === 'failed' || st === 'regression') return '<span class="badge badge-fail">回归</span>';
    if (typeof r.pass_rate === 'number') {
      var p = r.pass_rate <= 1 ? r.pass_rate * 100 : r.pass_rate;
      return p >= 80 ? '<span class="badge badge-pass">达标</span>' : '<span class="badge badge-fail">未达标</span>';
    }
    return '<span class="badge">—</span>';
  }

  function renderRows(rows) {
    tbody.innerHTML = '';
    if (!Array.isArray(rows) || rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无数据</td></tr>';
      return;
    }
    rows.forEach(function (r) {
      var suite = r.suite || r.benchmark || r.name || '—';
      var cat = r.category || r.subcategory || '—';
      var total = (typeof r.total === 'number') ? r.total : (typeof r.count === 'number' ? r.count : null);
      var passed = (typeof r.passed === 'number') ? r.passed : (typeof r.pass === 'number' ? r.pass : null);
      var rate = (typeof r.pass_rate === 'number') ? r.pass_rate
        : (total && passed != null ? passed / total : null);
      var p = (typeof rate === 'number') ? (rate <= 1 ? rate * 100 : rate) : 0;

      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + suite + '</td>' +
        '<td>' + cat + '</td>' +
        '<td class="num">' + (total == null ? '—' : fmt(total)) + '</td>' +
        '<td class="num">' + (passed == null ? '—' : fmt(passed)) + '</td>' +
        '<td class="num">' + pct(rate) + '</td>' +
        '<td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:' +
          Math.max(0, Math.min(100, p)) + '%"></div></div></td>' +
        '<td>' + statusBadge(r) + '</td>';
      tbody.appendChild(tr);
    });
  }

  function renderEmpty() {
    banner.style.display = 'block';
    renderStats([]);
    renderRows([]);
    noteEl.textContent = '';
  }

  fetch('/console/benchmark')
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (data) {
      banner.style.display = 'none';
      renderStats(data.stats);
      renderRows(data.rows);
      if (data.generated_at) metaEl.textContent = '数据生成时间：' + data.generated_at;
      if (data.note) noteEl.textContent = data.note;
    })
    .catch(function () {
      renderEmpty();
    });
})();
</script>
</body>
</html>
