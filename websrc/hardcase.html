<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>硬样本库 · 中文文风研究台</title>
<script>(function(){try{var t=localStorage.getItem('lg_theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="/lab/_shared/tokens.css">
<link rel="stylesheet" href="/lab/_shared/base.css">
</head>
<body>
<div class="lg-shell">
  <main class="lg-main">
    <div id="banner" class="banner"></div>

    <header class="lg-head">
      <div class="row">
        <h1>硬样本库</h1>
        <span class="meta" id="genAt">—</span>
      </div>
      <div class="sub">Hard Cases · 分歧超阈值的样本归档 / 三类待办 / 严重度榜</div>
    </header>

    <section class="stats" id="stats"></section>

    <div class="grid-2">
      <section class="card">
        <div class="card-head"><h2>进入条件分布</h2><span class="hint">by_kind</span></div>
        <div class="card-body"><div class="bars" id="barsKind"></div></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>三类待办</h2><span class="hint">need_*</span></div>
        <div class="card-body"><div class="bars" id="barsNeed"></div></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head">
        <h2>严重度榜（降序）</h2>
        <span class="hint" id="rowCount">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <p class="note">
      "进入条件"里多个标签用逗号并列（如 <span class="mono">human_lost_to_judges,unanimous_vs_user</span>）
      表示同一批样本同时满足多条进入规则，不是数据重复。
      待办三类的含义：需人工裁定 / 需本体补充 / 需策略修订。
    </p>
    <footer class="lg-foot"></footer>
  </main>
</div>

<script src="/lab/_shared/lg.js"></script>
<script>
LG.init('hard-cases', function (d, el) {
  var rows = d.top_by_severity || [];

  LG.statCards(el.stats, [
    { value: d.hard_cases,     label: '硬样本总数' },
    { value: d.need_human,     label: '待人工裁定', tone: 'warn', hint: 'need_human' },
    { value: d.need_ontology,  label: '待本体补充', hint: 'need_ontology' },
    { value: d.need_strategy,  label: '待策略修订', hint: 'need_strategy' },
    { value: rows.length,      label: '本页展示', hint: 'top_by_severity' }
  ]);

  LG.bars(LG.$('barsKind'), d.by_kind || {});
  LG.bars(LG.$('barsNeed'), {
    '待人工裁定': d.need_human, '待本体补充': d.need_ontology, '待策略修订': d.need_strategy
  });

  LG.table(el.tbody, rows, [
    { key: 'severity', label: '严重度', num: true, render: function (r) {
        var v = Number(r.severity);
        return isFinite(v) ? v.toLocaleString('zh-CN', { maximumFractionDigits: 4 }) : '—';
      } },
    { key: 'kind',     label: '进入条件', render: function (r) {
        return String(r.kind || '').split(',').map(function (t) {
          return '<span class="tag">' + LG.esc(t.trim()) + '</span>';
        }).join('');
      } },
    { key: 'why',      label: '说明/摘要', render: function (r) {
        var s = r.why == null ? '—' : String(r.why);
        return '<div title="' + LG.esc(s) + '">' + LG.esc(s.length > 90 ? s.slice(0, 90) + '…' : s) + '</div>';
      } },
    { key: 'need_human',     label: '需人工', num: true, render: function (r) { return r.need_human ? '是' : '否'; } },
    { key: 'experiment_id',  label: '实验' },
    { key: 'id',             label: 'ID', num: true }
  ], { head: el.head });

  LG.$('rowCount').textContent = '共 ' + LG.fmtNum(rows.length) + ' 条（Top N）';
});
</script>
</body>
</html>
