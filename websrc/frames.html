<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语义实验室 · 语言基因组</title>
<script>(function(){try{var t=localStorage.getItem('lg_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="/lab/_shared/tokens.css">
<link rel="stylesheet" href="/lab/_shared/base.css">
<link rel="stylesheet" href="/lab/_shared/editorial.css">
</head>
<body>
<div class="lg-shell">
  <main class="lg-main">
    <div id="banner" class="banner"></div>

    <header class="lg-head">
      <div class="row">
        <h1>语义实验室</h1>
        <span class="meta" id="genAt">—</span>
      </div>
      <div class="sub">SemanticFrame 抽取 · 粒度 / 状态 / 抽取模型分布 · 泄漏分数分层</div>
    </header>

    <section class="stats" id="stats"></section>

    <div class="grid-2">
      <section class="card">
        <div class="card-head"><h2>粒度分布</h2><span class="hint">by_granularity（L 主帧）</span></div>
        <div class="card-body"><div class="bars" id="barsGran"></div></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>抽取状态</h2><span class="hint">by_status</span></div>
        <div class="card-body"><div class="bars" id="barsStatus"></div></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>抽取模型</h2><span class="hint">by_extractor</span></div>
        <div class="card-body"><div class="bars" id="barsExtractor"></div></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>泄漏分数超阈值层</h2><span class="hint">over_0.6_by_layer</span></div>
        <div class="card-body"><div class="bars" id="barsLeakHi"></div></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head"><h2>泄漏层全量</h2><span class="hint">leakage_scores.by_layer</span></div>
      <div class="card-body"><div class="bars" id="barsLeak"></div></div>
    </section>

    <p class="note" id="note"></p>
    <footer class="lg-foot"></footer>
  </main>
</div>

<script src="/lab/_shared/lg.js"></script>
<script src="/lab/_shared/editorial.js"></script>
<script>
LG.init('semantic-lab', function (d, el) {
  var lk = d.leakage_scores || {};

  LG.statCards(el.stats, [
    { value: d.frames,             label: '语义帧', hint: 'frames (distinct)' },
    { value: d.segments_covered,   label: '覆盖段落', hint: 'segments_covered' },
    { value: d.propositions,       label: '命题数' },
    { value: lk.total,             label: '泄漏样本', hint: 'leakage_scores.total' },
    { value: Object.keys(d.by_granularity || {}).length, label: '粒度档位' }
  ]);

  LG.bars(LG.$('barsGran'), d.by_granularity || {});
  LG.bars(LG.$('barsStatus'), d.by_status || {});
  LG.bars(LG.$('barsExtractor'), d.by_extractor || {});
  LG.bars(LG.$('barsLeak'), lk.by_layer || {});
  LG.bars(LG.$('barsLeakHi'), lk['over_0.6_by_layer'] || {});

  LG.$('note').textContent =
    '泄漏分数 = 帧被盲眼模型重建回原句的程度；阈值 0.6 以上的层需重点看。' +
    '粒度 L 为主帧（本文档口径），M/S 为下位分解。';
});
</script>
</body>
</html>
