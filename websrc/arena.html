<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重构竞技场 · 中文文风研究台</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0e1116; color:#c9d1d9;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding:24px; line-height:1.6;
  }
  .num { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  header.page { margin-bottom:20px; }
  header.page h1 { font-size:22px; color:#e6edf3; font-weight:700; }
  header.page p { font-size:13px; color:#8b949e; margin-top:4px; }

  #banner {
    display:none; background:rgba(210,153,34,.12); border:1px solid #d29922;
    color:#e3b341; border-radius:10px; padding:10px 16px;
    font-size:13px; margin-bottom:16px;
  }
  #banner.show { display:block; }

  .stats {
    display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr));
    gap:14px; margin-bottom:22px;
  }
  .stat-card {
    background:#161b22; border:1px solid #263041; border-radius:10px;
    padding:16px 18px;
  }
  .stat-card .value { font-size:28px; font-weight:700; color:#58a6ff; }
  .stat-card .label { font-size:12px; color:#8b949e; margin-top:4px; }

  .card {
    background:#161b22; border:1px solid #263041; border-radius:10px;
    overflow:hidden; margin-bottom:22px;
  }
  .card-head {
    padding:14px 18px; border-bottom:1px solid #263041;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
  }
  .card-head h2 { font-size:15px; color:#e6edf3; font-weight:600; }
  .card-head .hint { font-size:12px; color:#8b949e; }

  .table-wrap { overflow-x:auto; max-height:520px; overflow-y:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th {
    position:sticky; top:0; z-index:2;
    background:#161b22; color:#8b949e; font-weight:600; text-align:left;
    padding:10px 14px; border-bottom:1px solid #263041; white-space:nowrap;
  }
  tbody td { padding:10px 14px; border-bottom:1px solid #21262d; vertical-align:top; }
  tbody tr:hover { background:rgba(88,166,255,.05); }

  .tag {
    display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px;
    border:1px solid #263041; color:#8b949e; margin:1px 2px;
  }
  .badge-win {
    display:inline-block; padding:2px 10px; border-radius:10px; font-size:11px;
    background:rgba(63,185,80,.15); color:#3fb950; border:1px solid rgba(63,185,80,.4);
    font-weight:600;
  }
  .badge-lose {
    display:inline-block; padding:2px 10px; border-radius:10px; font-size:11px;
    background:rgba(248,81,73,.1); color:#f85149; border:1px solid rgba(248,81,73,.3);
  }
  .badge-tie {
    display:inline-block; padding:2px 10px; border-radius:10px; font-size:11px;
    background:rgba(139,148,158,.12); color:#8b949e; border:1px solid #263041;
  }
  .empty { padding:40px; text-align:center; color:#8b949e; font-size:14px; }

  .arena-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:0; }
  .lane { border-right:1px solid #263041; padding:16px 18px; }
  .lane:last-child { border-right:none; }
  .lane h3 { font-size:13px; color:#58a6ff; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .lane .body { font-size:13px; color:#c9d1d9; white-space:pre-wrap; }
  .lane .meta { margin-top:10px; font-size:12px; color:#8b949e; }
  .lane.winner { background:rgba(63,185,80,.05); }
  .lane.winner h3 { color:#3fb950; }

  .diff-vars { padding:12px 18px; border-top:1px solid #263041; font-size:12px; color:#8b949e; }
  footer { margin-top:8px; font-size:12px; color:#8b949e; }
</style>
</head>
<body>

<header class="page">
  <h1>重构竞技场</h1>
  <p>同一段落 B0 / C / D 候选并排对照 · 可控变量标注 · 胜负标记 · 中文文风研究台（Language Genome）</p>
</header>

<div id="banner">数据接口不可用，以下为示例结构</div>

<section class="stats" id="stats"></section>

<section class="card">
  <div class="card-head">
    <h2>对阵记录</h2>
    <span class="hint" id="rowCount">共 0 场</span>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th>段落</th><th>对阵组合</th><th>可控变量</th><th>胜者</th><th>分差</th><th>时间</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyRow" style="display:none">暂无数据</div>
  </div>
</section>

<section class="card" id="detailCard" style="display:none">
  <div class="card-head">
    <h2 id="detailTitle">候选并排对照</h2>
    <span class="hint">点击上方对阵记录行查看</span>
  </div>
  <div class="arena-grid" id="arenaGrid"></div>
  <div class="diff-vars" id="diffVars"></div>
</section>

<footer>数据来源：<span class="num">/console/arena</span> · <span id="genAt">—</span></footer>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const fmt = n => (typeof n === 'number' && isFinite(n)) ? n.toLocaleString('zh-CN') : '—';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function showBanner(){ $('banner').classList.add('show'); }

  function renderStats(stats){
    const box = $('stats'); box.innerHTML = '';
    const list = Array.isArray(stats) && stats.length ? stats : [];
    if(!list.length){
      box.innerHTML = '<div class="stat-card"><div class="value num">—</div><div class="label">暂无指标</div></div>';
      return;
    }
    list.forEach(s => {
      const d = document.createElement('div');
      d.className = 'stat-card';
      d.innerHTML = '<div class="value num">' + fmt(s.value) + '</div>' +
                    '<div class="label">' + esc(s.label) + '</div>';
      box.appendChild(d);
    });
  }

  function winnerBadge(w){
    if(!w || w === '平局' || w === 'tie') return '<span class="badge-tie">平局</span>';
    return '<span class="badge-win">' + esc(w) + '</span>';
  }

  function renderRows(rows){
    const tb = $('tbody'); tb.innerHTML = '';
    const list = Array.isArray(rows) ? rows : [];
    $('rowCount').textContent = '共 ' + fmt(list.length) + ' 场';
    if(!list.length){ $('emptyRow').style.display = 'block'; return; }
    $('emptyRow').style.display = 'none';

    list.forEach((r, i) => {
      const tr = document.createElement('tr');
      tr.style.cursor = 'pointer';
      const vars = Array.isArray(r.variables) ? r.variables
                 : (Array.isArray(r.controlled_vars) ? r.controlled_vars : []);
      const pair = r.pair || ((r.candidates || []).map(c => c.name || c).join(' vs ')) || '—';
      tr.innerHTML =
        '<td class="num">' + (i+1) + '</td>' +
        '<td>' + esc(r.paragraph_id || r.paragraph || '—') + '</td>' +
        '<td>' + esc(pair) + '</td>' +
        '<td>' + (vars.length ? vars.map(v => '<span class="tag">' + esc(v) + '</span>').join('') : '—') + '</td>' +
        '<td>' + winnerBadge(r.winner) + '</td>' +
        '<td class="num">' + (r.margin != null ? fmt(r.margin) : '—') + '</td>' +
        '<td class="num" style="color:#8b949e">' + esc(r.time || r.created_at || '—') + '</td>';
      tr.addEventListener('click', () => renderDetail(r));
      tb.appendChild(tr);
    });
  }

  function renderDetail(r){
    $('detailCard').style.display = 'block';
    $('detailTitle').textContent = '候选并排对照 · ' + (r.paragraph_id || r.paragraph || '');
    const grid = $('arenaGrid'); grid.innerHTML = '';
    const cands = Array.isArray(r.candidates) ? r.candidates : [];
    if(!cands.length){
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1">暂无数据</div>';
    } else {
      cands.forEach(c => {
        const name = c.name || c.lane || '?';
        const isWin = r.winner && r.winner === name;
        const lane = document.createElement('div');
        lane.className = 'lane' + (isWin ? ' winner' : '');
        lane.innerHTML =
          '<h3>' + esc(name) + (isWin ? ' <span class="badge-win">胜</span>' : '') + '</h3>' +
          '<div class="body">' + esc(c.text || c.content || '（无正文）') + '</div>' +
          '<div class="meta">得分：<span class="num">' + (c.score != null ? fmt(c.score) : '—') + '</span></div>';
        grid.appendChild(lane);
      });
    }
    const vars = Array.isArray(r.variables) ? r.variables
               : (Array.isArray(r.controlled_vars) ? r.controlled_vars : []);
    $('diffVars').innerHTML = '<strong style="color:#c9d1d9">可控变量：</strong>' +
      (vars.length ? vars.map(v => '<span class="tag">' + esc(v) + '</span>').join('') : '未标注');
    $('detailCard').scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  fetch('/console/arena')
    .then(res => { if(!res.ok) throw new Error(res.status); return res.json(); })
    .then(data => {
      renderStats(data.stats);
      renderRows(data.rows);
      $('genAt').textContent = data.generated_at || '—';
    })
    .catch(() => {
      showBanner();
      renderStats([]);
      renderRows([]);
      $('genAt').textContent = '—';
    });
})();
</script>
</body>
</html>
