<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表达残差 · 中文文风研究台</title>
<script>(function(){try{var t=localStorage.getItem('lg_theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="/lab/_shared/tokens.css">
<link rel="stylesheet" href="/lab/_shared/base.css">
</head>
<body>
<div class="lg-shell">
  <main class="lg-main">
    <div id="banner" class="banner"></div>

    <header class="lg-head">
      <div class="row">
        <h1>表达残差</h1>
        <span class="meta" id="genAt">—</span>
      </div>
      <div class="sub">Expression Residual · 确定性残差 / 语义残差 / 潜文本保留度 / payload 字段分布</div>
    </header>

    <section class="stats" id="stats"></section>

    <div class="grid-2">
      <section class="card">
        <div class="card-head"><h2>残差状态</h2><span class="hint">by_status</span></div>
        <div class="card-body"><div class="bars" id="barsStatus"></div></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>残差模型</h2><span class="hint">by_model</span></div>
        <div class="card-body"><div class="bars" id="barsModel"></div></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>payload 字段频次</h2><span class="hint">sem_payload_keys</span></div>
        <div class="card-body"><div class="bars" id="barsKeys"></div></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>潜文本保留度</h2><span class="hint">subtext_preserved</span></div>
        <div class="card-body" id="subtextBox"></div>
      </section>
    </div>

    <p class="note">
      残差 = 重建候选相对原段在"表达层"的偏离。确定性残差（<span class="mono">residuals_det</span>）由
      规则/指标直接算；语义残差（<span class="mono">residuals_sem</span>）由模型判定并落 payload。
      潜文本保留度越低，说明重建把"没说出口的意思"讲白了。
    </p>
    <footer class="lg-foot"></footer>
  </main>
</div>

<script src="/lab/_shared/lg.js"></script>
<script>
LG.init('expression-residual', function (d, el) {
  var st = d.by_status || {};
  var sub = d.subtext_preserved || {};

  LG.statCards(el.stats, [
    { value: d.residuals_det, label: '确定性残差', hint: 'residuals_det' },
    { value: d.residuals_sem, label: '语义残差',   hint: 'residuals_sem' },
    { value: st.ok,           label: '成功', tone: 'ok',  hint: 'by_status.ok' },
    { value: st.failed,       label: '失败', tone: 'bad', hint: 'by_status.failed' },
    { value: sub.n,           label: '潜文本样本数', hint: 'subtext_preserved.n' },
    { value: sub.mean == null ? null : Math.round(sub.mean * 1000) / 10, label: '潜文本保留度均值 %', tone: 'accent', hint: 'subtext_preserved.mean' }
  ]);

  LG.bars(LG.$('barsStatus'), st);
  LG.bars(LG.$('barsModel'), d.by_model || {});
  LG.bars(LG.$('barsKeys'), d.sem_payload_keys || {});

  var box = LG.$('subtextBox');
  if (sub.mean == null) {
    box.innerHTML = '<div class="empty">暂无潜文本读数</div>';
  } else {
    var pct = Math.max(2, Math.round(sub.mean * 100));
    box.innerHTML =
      '<div class="bar-row"><div class="k">均值</div>' +
      '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div>' +
      '<div class="v">' + LG.fmtPct(sub.mean) + '</div></div>' +
      '<p class="note">样本 n = ' + LG.fmtNum(sub.n) + '（近 ' + LG.fmtNum(2000) + ' 条 payload 上限内统计）。</p>';
  }
});
</script>
</body>
</html>
