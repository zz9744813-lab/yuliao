<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>偏好实验室 · 语言基因组</title>
<script>(function(){try{var t=localStorage.getItem('lg_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="/lab/_shared/tokens.css">
<link rel="stylesheet" href="/lab/_shared/base.css">
<link rel="stylesheet" href="/lab/_shared/editorial.css">
</head>
<body>
<div class="lg-shell">
  <main class="lg-main">
    <div id="banner" class="banner"></div>

    <header class="lg-head">
      <div class="row">
        <h1>偏好实验室</h1>
        <span class="meta" id="genAt">—</span>
      </div>
      <div class="sub">Preference Lab · 盲评队列进度 / 判定去向 / 批次分布 / 一致性门禁</div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="card">
      <div class="card-head"><h2>一致性门禁</h2><span class="hint">gate</span></div>
      <div class="card-body" id="gateBox"></div>
    </section>

    <div class="grid-2">
      <section class="card">
        <div class="card-head"><h2>队列状态</h2><span class="hint">by_status</span></div>
        <div class="card-body"><div class="bars" id="barsStatus"></div></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>判定去向</h2><span class="hint">winner_resolved</span></div>
        <div class="card-body"><div class="bars" id="barsWinner"></div></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head"><h2>批次分布</h2><span class="hint">batches</span></div>
      <div class="card-body"><div class="bars" id="barsBatches"></div></div>
    </section>

    <p class="note">
      判定写入在盲评台 <span class="mono">/</span>，本页只读。判定去向里
      <span class="mono">human / candidate</span> 表示人类稿或候选稿被选中（构成可用偏好对），
      <span class="mono">tie / both_bad / cant_judge</span> 为无效信号，
      <span class="mono">A / B</span> 是历史遗留的匿名标签（数据口径未统一，如实呈现）。
    </p>
    <footer class="lg-foot"></footer>
  </main>
</div>

<script src="/lab/_shared/lg.js"></script>
<script src="/lab/_shared/editorial.js"></script>
<script>
LG.init('preference-lab', function (d, el) {
  var st = d.by_status || {};
  var win = d.winner_resolved || {};
  var ZH = { human: '人类稿胜', candidate: '候选稿胜', tie: '平局', both_bad: '都差', cant_judge: '无法判', A: 'A（历史）', B: 'B（历史）' };
  var winZh = {};
  Object.keys(win).forEach(function (k) { winZh[ZH[k] || k] = win[k]; });

  LG.statCards(el.stats, [
    { value: d.review_items,  label: '队列题数', hint: 'review_items' },
    { value: st.done,         label: '已判定', tone: 'ok',  hint: 'by_status.done' },
    { value: st.pending,      label: '待判定', hint: 'by_status.pending' },
    { value: win.human,       label: '人类稿胜出' },
    { value: win.candidate,   label: '候选稿胜出' },
    { value: Object.keys(d.batches || {}).length, label: '批次数' }
  ]);

  var gate = LG.$('gateBox');
  gate.innerHTML = d.gate
    ? '<span class="badge bad">未过门</span> <span style="color:var(--fg-2)">' + LG.esc(d.gate) + '</span>'
    : '<div class="empty">未登记门禁口径</div>';

  LG.bars(LG.$('barsStatus'), st);
  LG.bars(LG.$('barsWinner'), winZh);
  LG.bars(LG.$('barsBatches'), d.batches || {});
});
</script>
</body>
</html>
