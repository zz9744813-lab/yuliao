<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>评委竞技场 · 语言基因组</title>
<script>(function(){try{var t=localStorage.getItem('lg_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="/lab/_shared/tokens.css">
<link rel="stylesheet" href="/lab/_shared/base.css">
<link rel="stylesheet" href="/lab/_shared/editorial.css">
</head>
<body>
<div class="lg-shell">
  <main class="lg-main">
    <div id="banner" class="banner"></div>

    <header class="lg-head">
      <div class="row">
        <h1>评委竞技场</h1>
        <span class="meta" id="genAt">—</span>
      </div>
      <div class="sub">Judge Arena · 评委调用量 / 弃权与失败率 / 任务类型分布 / 已知方向性偏差</div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="card">
      <div class="card-head"><h2>已知偏差（读数必对照）</h2><span class="hint">known_bias</span></div>
      <div class="card-body" id="biasBox"></div>
    </section>

    <div class="grid-2">
      <section class="card">
        <div class="card-head"><h2>判题类型分布</h2><span class="hint">by_kind</span></div>
        <div class="card-body"><div class="bars" id="barsKind"></div></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>调用状态</h2><span class="hint">by_status</span></div>
        <div class="card-body"><div class="bars" id="barsStatus"></div></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head">
        <h2>模型记分板（按调用量降序）</h2>
        <span class="hint" id="rowCount">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <footer class="lg-foot"></footer>
  </main>
</div>

<script src="/lab/_shared/lg.js"></script>
<script src="/lab/_shared/editorial.js"></script>
<script>
LG.init('judge-arena', function (d, el) {
  var st = d.by_status || {};
  var rows = (d.leaderboard || []).slice().sort(function (a, b) { return (b.calls || 0) - (a.calls || 0); });

  LG.statCards(el.stats, [
    { value: d.judge_runs,       label: '评委调用数', hint: 'judge_runs' },
    { value: st.ok,              label: '解析成功', tone: 'ok',  hint: 'by_status.ok' },
    { value: st.failed,          label: '调用失败', tone: 'bad', hint: 'by_status.failed' },
    { value: st.failed_parse,    label: '解析失败', tone: 'bad', hint: 'by_status.failed_parse' },
    { value: d.abstain_total,    label: '弃权合计', hint: 'abstain_total' },
    { value: rows.length,        label: '在榜模型数' }
  ]);

  var bias = LG.$('biasBox');
  if (d.known_bias) {
    bias.innerHTML = '<span class="badge warn">方向性偏差</span> <span style="color:var(--fg-2)">' +
                     LG.esc(d.known_bias) + '</span>';
  } else {
    bias.innerHTML = '<div class="empty">未登记已知偏差</div>';
  }

  LG.bars(LG.$('barsKind'), d.by_kind || {});
  LG.bars(LG.$('barsStatus'), st);

  LG.table(el.tbody, rows, [
    { key: 'model',          label: '模型' },
    { key: 'prompt_version', label: '提示词版本' },
    { key: 'calls',          label: '调用数',   num: true },
    { key: 'abstain_rate',   label: '弃权率',   num: true, render: function (r) { return LG.fmtPct(r.abstain_rate); } },
    { key: 'failed_rate',    label: '失败率',   num: true, render: function (r) { return LG.fmtPct(r.failed_rate); } }
  ], { head: el.head });

  LG.$('rowCount').textContent = '共 ' + LG.fmtNum(rows.length) + ' 条（模型 × 提示词版本）';
});
</script>
</body>
</html>
