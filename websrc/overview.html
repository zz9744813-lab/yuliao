<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>总览总控台 · 中文文风研究台</title>
<script>(function(){try{var t=localStorage.getItem('lg_theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="/lab/_shared/tokens.css">
<link rel="stylesheet" href="/lab/_shared/base.css">
</head>
<body>
<div class="lg-shell">
  <main class="lg-main">
    <div id="banner" class="banner"></div>

    <header class="lg-head">
      <div class="row">
        <h1>总览总控台</h1>
        <span class="meta" id="genAt">—</span>
      </div>
      <div class="sub">全项目健康度 · 语料 / 语义帧 / 候选 / 判定 / 基准，一屏总览</div>
    </header>

    <section class="stats" id="stats"></section>

    <div class="grid-2">
      <section class="card">
        <div class="card-head"><h2>实验状态分布</h2><span class="hint">experiments.by_status</span></div>
        <div class="card-body"><div class="bars" id="bars"></div></div>
      </section>

      <section class="card">
        <div class="card-head"><h2>基准最佳模型</h2><span class="hint">benchmark_runs 均值</span></div>
        <div class="card-body" id="bestModel"></div>
      </section>
    </div>

    <p class="note">
      本页读数直接来自只读聚合接口 <span class="mono">/console/dashboard</span>，不做二次计算。
      指标口径与各模块页一致；写操作全部在盲评台（第一界面），研究台只读。
    </p>

    <footer class="lg-foot"></footer>
  </main>
</div>

<script src="/lab/_shared/lg.js"></script>
<script>
LG.init('dashboard', function (d, el) {
  var exp = d.experiments || {};
  var best = d.best_benchmark_model || null;

  LG.statCards(el.stats, [
    { value: d.human_anchors,   label: '人类锚点段', hint: 'segments (distinct)' },
    { value: d.works,           label: '作品数' },
    { value: d.semantic_frames, label: '语义帧',     hint: 'frames (distinct)' },
    { value: d.candidates_ok,   label: '可用候选',   hint: 'status = ok' },
    { value: d.human_judged,    label: '已判定题',   hint: 'review_items done' },
    { value: d.preference_pairs,label: '偏好对',     hint: 'human vs candidate' },
    { value: d.hard_cases,      label: '硬样本' },
    { value: d.benchmark_items, label: '基准题目' },
    { value: exp.total,         label: '实验总数',   hint: '运行中 ' + LG.fmtNum(d.active_experiments || 0) },
    { value: d.llm_calls_total, label: 'LLM 调用',   hint: '累计' },
    best ? { value: best.model, label: '基准最佳模型', hint: '均值准确率 ' + LG.fmtPct(best.avg_accuracy), tone: 'accent' }
         : { value: '—',        label: '基准最佳模型', hint: '暂无跑分' }
  ]);

  LG.bars(LG.$('bars'), exp.by_status || {});

  var box = LG.$('bestModel');
  if (!best) {
    box.innerHTML = '<div class="empty">暂无基准跑分记录</div>';
  } else {
    box.innerHTML =
      '<div class="bar-row"><div class="k">模型</div>' +
        '<div><span class="badge">' + LG.esc(best.model) + '</span></div><div class="v"></div></div>' +
      '<div class="bar-row" style="margin-top:10px"><div class="k">均值准确率</div>' +
        '<div class="track"><div class="fill" style="width:' +
          Math.max(2, Math.round((best.avg_accuracy || 0) * 100)) + '%"></div></div>' +
        '<div class="v">' + LG.fmtPct(best.avg_accuracy) + '</div></div>' +
      '<p class="note">口径：benchmark_runs 按模型分组的 accuracy 均值（全量记录，非时间窗）。</p>';
  }

  el.genAt.textContent = d.generated_at ? LG.fmtTime(d.generated_at) : '';
});
</script>
</body>
</html>
